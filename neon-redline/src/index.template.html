<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Neon Redline</title>
<style>
:root{--bg:#05060a;--panel:rgba(10,12,22,.82);--line:rgba(255,255,255,.12);--txt:#e8f0ff;--dim:#8d9bb5;--pink:#ff2a6d;--cyan:#05d9e8;--gold:#ffc83d;--ok:#3dff9a;--bad:#ff4d4d;--font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:20}
#loading{display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#17102d,#05060a);z-index:50}
#loading h1,#menu h1{margin:0;font-size:clamp(2rem,min(9vw,11vh),5.5rem);font-weight:900;letter-spacing:.18em;font-style:italic;color:#fff;text-shadow:0 0 18px var(--pink),0 0 60px var(--pink),4px 4px 0 var(--cyan)}
.bar{width:min(420px,80vw);height:6px;background:#1a1f33;border-radius:3px;margin:22px auto 8px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .2s}
#loadmsg{color:var(--dim);font-size:.9rem;letter-spacing:.08em}
#menu{display:flex;flex-direction:column;justify-content:center;overflow:auto;padding:12px max(5vw,24px);background:linear-gradient(90deg,rgba(5,6,10,.92) 0%,rgba(5,6,10,.55) 45%,rgba(5,6,10,0) 80%)}
#menu .sub{color:var(--cyan);letter-spacing:.35em;font-size:.8rem;margin:6px 0 28px;text-transform:uppercase}
.mbtn{display:block;width:min(360px,90vw);text-align:left;margin:4px 0;padding:min(13px,1.6vh) 22px;font:700 1rem var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--txt);background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid transparent;cursor:pointer;transform:skewX(-8deg);transition:.12s}
.mbtn>span{display:inline-block;transform:skewX(8deg)}.mbtn:hover,.mbtn:focus-visible{background:rgba(255,42,109,.18);border-left-color:var(--pink);padding-left:30px;outline:none}.mbtn[disabled]{opacity:.35;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:4px}
.title{font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-size:.8rem}
/* HUD */
#hud{pointer-events:none;z-index:10;position:fixed;inset:0;font-variant-numeric:tabular-nums}
#speedo{position:absolute;right:max(2.5vw,14px);bottom:max(3vh,14px);width:min(300px,52vw);text-align:right;text-shadow:0 2px 10px #000}
#spd{font:900 clamp(3.2rem,10vw,5.6rem)/1 var(--font);font-style:italic;letter-spacing:-.02em}#spd small{font-size:.28em;letter-spacing:.2em;color:var(--dim);font-style:normal;margin-left:.4em}
#gear{display:inline-block;min-width:1.4em;text-align:center;font:900 clamp(1.8rem,5vw,2.8rem) var(--font);color:var(--cyan);margin-right:.5em}
#rpmbar{height:9px;background:rgba(255,255,255,.12);margin:6px 0 4px;border-radius:2px;overflow:hidden;position:relative}#rpmbar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan),#fff 70%,var(--pink));width:0}
#rpmtxt{font-size:.78rem;color:var(--dim);letter-spacing:.1em}
.mini{height:6px;background:rgba(255,255,255,.12);margin-top:5px;border-radius:2px;overflow:hidden}.mini>i{display:block;height:100%;width:0}
#nitrobar>i{background:linear-gradient(90deg,#1a7cff,#5df)}#boostbar>i{background:linear-gradient(90deg,#ffa300,#ffe36b)}
#mapwrap{position:absolute;left:max(2vw,12px);bottom:max(3vh,12px);width:clamp(150px,22vw,230px);aspect-ratio:1}
#minimap{width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:0 0 26px rgba(5,217,232,.25),inset 0 0 20px #000;background:#0a0d16}
#street{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:.72rem;letter-spacing:.12em;color:var(--dim);white-space:nowrap;text-transform:uppercase}
#heat{position:absolute;left:max(2vw,12px);bottom:calc(max(3vh,12px) + clamp(150px,22vw,230px) + 12px);display:none}
#heat .stars{font-size:1.6rem;letter-spacing:.15em;text-shadow:0 0 12px currentColor}#heat .lbl{font-size:.7rem;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
#heat .cool{height:5px;width:150px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:5px;overflow:hidden}#heat .cool>i{display:block;height:100%;width:0;background:var(--ok)}#heat .bust>i{background:var(--bad)}
#topleft{position:absolute;left:max(2vw,12px);top:max(2vh,12px);font-size:.85rem;letter-spacing:.06em;text-shadow:0 2px 8px #000}#topleft b{color:var(--gold)}
#topright{position:absolute;right:max(2vw,12px);top:max(2vh,12px);text-align:right;font-size:.8rem;color:var(--dim);letter-spacing:.08em;text-shadow:0 2px 8px #000}
#event{position:absolute;left:50%;top:max(2vh,12px);transform:translateX(-50%);text-align:center;min-width:240px;display:none;text-shadow:0 2px 10px #000}
#event .ename{font-size:.72rem;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}#event .etime{font:900 2.2rem var(--font);font-style:italic}#event .einfo{font-size:.95rem;letter-spacing:.08em}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none}
.t{font:900 clamp(1.4rem,4vw,2.4rem) var(--font);font-style:italic;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 18px rgba(0,0,0,.8),0 0 26px var(--c,#fff);animation:pop 2.6s forwards;margin:4px 0}.t small{display:block;font-size:.42em;letter-spacing:.18em;color:var(--dim);font-style:normal}
@keyframes pop{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#radio{position:absolute;left:50%;bottom:max(16vh,90px);transform:translateX(-50%);max-width:min(560px,86vw);text-align:center;font-size:.95rem;color:#cfe;text-shadow:0 2px 8px #000;display:none}
#radio b{color:var(--cyan);letter-spacing:.14em;font-size:.72rem;text-transform:uppercase}
#dmg{position:absolute;right:max(2.5vw,14px);bottom:calc(max(3vh,14px) + 150px);width:62px;height:98px;display:none}
#count{position:absolute;inset:0;display:none;place-content:center;text-align:center;font:900 clamp(6rem,24vw,14rem) var(--font);font-style:italic;text-shadow:0 0 40px var(--pink)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:9}
#wipe{position:fixed;inset:0;pointer-events:none;z-index:8;display:none}
#hint{position:absolute;left:50%;bottom:max(24vh,120px);transform:translateX(-50%);padding:8px 16px;background:var(--panel);border:1px solid var(--line);font-size:.9rem;letter-spacing:.06em;display:none}
kbd{display:inline-block;padding:1px 7px;border:1px solid var(--dim);border-bottom-width:2px;border-radius:3px;font:700 .8em var(--font);color:#fff;background:rgba(255,255,255,.08);margin:0 2px}
/* Dialog/Overlay */
.overlay{display:flex;align-items:center;justify-content:center;background:rgba(3,4,10,.72);z-index:30}
.card{width:min(760px,94vw);max-height:90vh;overflow:auto;padding:22px 26px}
.card h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;font-style:italic}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.row>label{min-width:150px;color:var(--dim);font-size:.9rem}
.btn{padding:9px 18px;font:700 .85rem var(--font);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer;border-radius:2px}
.btn:hover{background:rgba(5,217,232,.2);border-color:var(--cyan)}.btn.pri{background:linear-gradient(90deg,var(--pink),#c1145a);border-color:transparent}.btn.pri:hover{filter:brightness(1.2)}.btn[disabled]{opacity:.35;pointer-events:none}.btn.sel{border-color:var(--cyan);background:rgba(5,217,232,.25)}
select,input[type=range],input[type=text],input[type=color]{font:inherit;color:var(--txt);background:#0e1220;border:1px solid var(--line);padding:6px 8px;border-radius:2px}input[type=range]{padding:0;accent-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:.82rem;border-radius:2px}.chip:hover{border-color:var(--cyan)}.chip.sel{border-color:var(--pink);background:rgba(255,42,109,.16)}.chip small{color:var(--dim);display:block}.chip.lock{opacity:.45}
.cls{display:inline-block;min-width:1.7em;text-align:center;padding:0 5px;font-weight:900;color:#000;border-radius:2px;margin-right:6px}
.stat{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;font-size:.8rem;margin:4px 0}.stat .b{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.stat .b>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
/* Garage */
#garage{display:flex;z-index:25;pointer-events:none}
#garage .side{pointer-events:auto;width:min(430px,100vw);height:100%;padding:16px;overflow:auto;background:linear-gradient(90deg,rgba(5,6,10,.94),rgba(5,6,10,.7) 80%,rgba(5,6,10,0))}
#garage .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tabs .btn{padding:7px 11px;font-size:.72rem}
#garage .foot{position:fixed;right:max(2vw,14px);bottom:max(3vh,14px);pointer-events:auto;text-align:right}
#garage .carname{position:fixed;right:max(2vw,14px);top:max(2vh,14px);text-align:right;pointer-events:none;text-shadow:0 2px 12px #000}.carname h3{margin:0;font:900 clamp(1.4rem,4vw,2.4rem) var(--font);font-style:italic;letter-spacing:.08em;text-transform:uppercase}
.up{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.up small{color:var(--dim);display:block}.lv{display:flex;gap:3px;margin-top:4px}.lv i{width:22px;height:6px;background:rgba(255,255,255,.15);border-radius:1px}.lv i.on{background:var(--cyan)}
.sw{display:flex;gap:5px;flex-wrap:wrap}.sw i{width:26px;height:26px;border:2px solid transparent;cursor:pointer;border-radius:2px}.sw i.sel{border-color:#fff}
/* Karte */
#fullmap{z-index:28;background:rgba(3,4,10,.9)}#fullmap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}#fullmap .legend{position:absolute;left:14px;top:12px;font-size:.8rem;color:var(--dim);letter-spacing:.06em;line-height:1.7}
#touch{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}#touch .tb{position:absolute;pointer-events:auto;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);color:#fff;font:800 .72rem var(--font);display:grid;place-content:center;touch-action:none;letter-spacing:.06em}
.tb.on{background:rgba(255,42,109,.4)}
@media (max-width:700px){#speedo{width:48vw}.mbtn{padding:10px 18px}}
</style>
</head><body>
<canvas id="game" tabindex="0"></canvas>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="topleft"><div><b id="money">$0</b> &nbsp; <span id="lvl">LVL 1</span></div><div style="color:var(--dim);font-size:.72rem" id="xptxt"></div></div>
  <div id="topright"><div id="clock"></div><div id="weather"></div><div id="radioname"></div></div>
  <div id="event"><div class="ename" id="ename"></div><div class="etime" id="etime"></div><div class="einfo" id="einfo"></div></div>
  <div id="toast"></div><div id="radio"></div><div id="hint"></div><div id="count"></div>
  <div id="heat"><div class="stars" id="stars"></div><div class="lbl" id="heatlbl"></div><div class="cool" id="coolbar"><i></i></div><div class="cool bust" id="bustbar"><i></i></div></div>
  <div id="mapwrap"><canvas id="minimap" width="460" height="460"></canvas><div id="street"></div></div>
  <div id="dmg"><canvas id="dmgc" width="62" height="98"></canvas></div>
  <div id="speedo"><div><span id="gear">N</span><span id="spd">0<small>km/h</small></span></div><div id="rpmbar"><i></i></div><div id="rpmtxt"></div>
    <div class="mini" id="nitrobar"><i></i></div><div class="mini" id="boostbar"><i></i></div></div>
</div>
<div id="touch"></div>
<div id="loading" class="screen"><div><h1>NEON REDLINE</h1><div class="bar"><i id="loadbar"></i></div><div id="loadmsg">Lade Welt …</div></div></div>
<div id="menu" class="screen hidden"><h1>NEON<br>REDLINE</h1><div class="sub">Meridian City · Open World Street Racing</div><div id="menubtns"></div></div>
<div id="overlay" class="screen overlay hidden"><div class="card panel" id="card"></div></div>
<div id="garage" class="screen hidden"><div class="side" id="gside"></div><div class="carname" id="gname"></div><div class="foot" id="gfoot"></div></div>
<div id="fullmap" class="screen hidden"><canvas id="mapc"></canvas><div class="legend" id="maplegend"></div></div>
<!--VENDOR-->
<!--SOURCE-->
</body></html>
